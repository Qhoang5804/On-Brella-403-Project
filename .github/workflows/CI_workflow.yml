name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: npm ci || npm install

      - name: Install hardware mock dependencies
        run: cd hardwareSimulation && npm ci || npm install

      - name: Start hardware mock
        run: |
          cd hardwareSimulation && npm start &
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/hardware/stations | grep -q 200 || (echo "Mock failed to start" && exit 1)

      - name: Run all tests
        run: npm test
